name: Renovar token de Instagram

# El token de larga duración caduca a los 60 días; se renueva cada semana.
# Necesita el secreto GH_PAT (token de GitHub con permiso para escribir secretos de este repositorio).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar y guardar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          case "$IG_ACCESS_TOKEN" in IG*) ;; *) echo "El token no es de Instagram (IG...): la renovación automática no aplica."; exit 0;; esac
          nuevo=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$nuevo"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$nuevo"
          echo "Token renovado."
